<!DOCTYPE html>
<html lang="{{ current_lang() }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('auth.account_title') }}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="{{ url_for('static', filename='assets/tailwind-config.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='assets/theme.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/favicon.png') }}">
</head>
<body class="min-h-screen">

    <header class="border-b border-k_border">
        <div class="max-w-6xl mx-auto px-4 md:px-8 py-4 flex items-center justify-between">
            <img src="{{ url_for('static', filename='assets/kelvex_core.svg') }}" alt="Kelvex Core" class="h-9">
            <nav class="flex items-center gap-5 text-sm font-gui text-k_text_mut">
                <a href="/" class="hover:text-k_text flex items-center gap-1.5">
                    <img src="{{ url_for('static', filename='assets/icons/icon_09_dashboard.svg') }}" alt="" class="h-3.5 w-3.5 opacity-70">
                    {{ t('nav.dashboard') }}
                </a>
                <a href="/agents" class="hover:text-k_text flex items-center gap-1.5">
                    <img src="{{ url_for('static', filename='assets/icons/icon_01_endpoint.svg') }}" alt="" class="h-3.5 w-3.5 opacity-70">
                    {{ t('nav.agents') }}
                </a>
                <a href="/updates" class="hover:text-k_text flex items-center gap-1.5">
                    <img src="{{ url_for('static', filename='assets/icons/icon_10_refresh.svg') }}" alt="" class="h-3.5 w-3.5 opacity-70">
                    {{ t('nav.updates') }}
                </a>
                <a href="/licenses" class="hover:text-k_text flex items-center gap-1.5">
                    <img src="{{ url_for('static', filename='assets/icons/icon_11_key.svg') }}" alt="" class="h-3.5 w-3.5 opacity-70">
                    {{ t('nav.licenses') }}
                </a>
                <a href="/account" class="text-k_text flex items-center gap-1.5">
                    <img src="{{ url_for('static', filename='assets/icons/icon_12_account.svg') }}" alt="" class="h-3.5 w-3.5">
                    {{ t('nav.account') }}
                </a>
            </nav>
            <div class="flex items-center gap-4">
                <form method="post" action="/logout">
                    <button type="submit" class="text-xs text-k_text_mut hover:text-k_text font-mono">{{ t('nav.logout') }}</button>
                </form>
                <div class="flex items-center gap-1.5 font-mono text-xs">
                    <a href="/lang/en" class="{{ 'text-k_normal' if current_lang() == 'en' else 'text-k_text_mut hover:text-k_text' }}">EN</a>
                    <span class="text-k_border">/</span>
                    <a href="/lang/de" class="{{ 'text-k_normal' if current_lang() == 'de' else 'text-k_text_mut hover:text-k_text' }}">DE</a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-sm mx-auto px-4 md:px-8 py-10">
        <h1 class="text-2xl font-gui font-semibold text-k_text mb-2">{{ t('auth.account_heading') }}</h1>
        <p class="text-k_text_mut text-xs mb-8">{{ t('auth.change_password_notice') }}</p>

        <div class="panel-container">
            <div class="p-5">
                {% if error %}
                <p class="text-xs text-k_crit mb-4">{{ t('auth.error_' + error).format(min_length=min_length) }}</p>
                {% endif %}

                <form method="post">
                    <label class="block text-xs text-k_text_mut mb-1">{{ t('auth.current_password_label') }}</label>
                    <input type="password" name="current_password" autofocus required
                        class="w-full bg-k_bg border border-k_border rounded px-3 py-2 text-sm text-k_text mb-3">

                    <label class="block text-xs text-k_text_mut mb-1">{{ t('auth.new_password_label') }}</label>
                    <input type="password" name="new_password" required
                        class="w-full bg-k_bg border border-k_border rounded px-3 py-2 text-sm text-k_text mb-3">

                    <label class="block text-xs text-k_text_mut mb-1">{{ t('auth.confirm_label') }}</label>
                    <input type="password" name="confirm" required
                        class="w-full bg-k_bg border border-k_border rounded px-3 py-2 text-sm text-k_text mb-4">

                    <button type="submit" class="w-full bg-k_normal text-k_bg font-gui font-semibold text-sm px-4 py-2 rounded-lg hover:opacity-90 transition-opacity">
                        {{ t('auth.change_password_button') }}
                    </button>
                </form>
            </div>
        </div>
    </main>

</body>
</html>
